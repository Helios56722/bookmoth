<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Sample photosynthesis notes</title><desc id="desc">A diagram showing inputs and outputs of photosynthesis.</desc>
  <rect width="1200" height="800" fill="#f5efdf"/><rect x="56" y="54" width="1088" height="692" rx="22" fill="#fffaf0" stroke="#725782" stroke-width="5"/>
  <text x="105" y="145" font-family="Georgia" font-size="62" fill="#36243e">Photosynthesis</text><path d="M105 175h990" stroke="#dbac63" stroke-width="5"/>
  <circle cx="880" cy="330" r="84" fill="#f2bf59"/><path d="M638 610c105-188 130-285 191-309-23 136-10 226-191 309z" fill="#60a66e"/><path d="M640 605c-117-97-139-183-88-242 104 61 139 140 88 242z" fill="#74b881"/><path d="M640 605v75" stroke="#456d4c" stroke-width="20"/>
  <g font-family="Arial" font-size="34" fill="#44364b"><text x="110" y="270">Inputs</text><text x="110" y="325">• carbon dioxide</text><text x="110" y="375">• water</text><text x="110" y="425">• light energy</text><text x="870" y="520">Outputs</text><text x="870" y="575">• glucose</text><text x="870" y="625">• oxygen</text></g>
  <path d="M390 350c100-40 156-48 225-24" fill="none" stroke="#8062c9" stroke-width="8" marker-end="url(#arrow)"/><path d="M797 524c44-24 70-35 104-35" fill="none" stroke="#8062c9" stroke-width="8" marker-end="url(#arrow)"/>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0 0L8 3 0 6z" fill="#8062c9"/></marker></defs>
</svg>
